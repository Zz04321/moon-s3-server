services:
  s3:
    build: .
    image: moon-s3-server:local
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MOON_S3_ACCESS_KEY: ${MOON_S3_ACCESS_KEY:?Set MOON_S3_ACCESS_KEY}
      MOON_S3_SECRET_KEY: ${MOON_S3_SECRET_KEY:?Set MOON_S3_SECRET_KEY}
    volumes:
      - s3-data:/data
    stop_grace_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  s3-data:
