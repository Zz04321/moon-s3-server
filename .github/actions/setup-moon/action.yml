name: Set up verified MoonBit
description: Install the hash-locked Linux x86-64 toolchain and update dependencies
runs:
  using: composite
  steps:
    - name: Install native prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev pkg-config
    - name: Cache locked toolchain archives
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/moon-s3-toolchain-archives
        key: moon-s3-toolchain-linux-x86_64-${{ hashFiles('scripts/toolchain-lock.json') }}
    - name: Install verified toolchain
      shell: bash
      run: |
        python3 scripts/install_toolchain.py --destination "$RUNNER_TEMP/moon-s3-toolchain" \
          --cache "$RUNNER_TEMP/moon-s3-toolchain-archives"
        echo "$RUNNER_TEMP/moon-s3-toolchain/bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$RUNNER_TEMP/moon-s3-toolchain" >> "$GITHUB_ENV"
    - name: Show versions and update dependencies
      shell: bash
      run: |
        moon version --all
        moon update
